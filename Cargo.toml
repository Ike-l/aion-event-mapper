[package]
name = "aion-event-mapper"
version = "0.1.0"
edition = "2024"

[dependencies]
aion-event = { path = "../../aion-event" }
aion-program = { path = "../../aion-program" }
aion-processor = { path = "../../aion-processor" }
aion-ecs = { path = "../../aion-ecs" }

tokio = { version = "1.52.3", optional = true }

[features]
default = ["and-mapping", "or-mapping"]
or-mapping = ["tokio"]
and-mapping =["tokio"]